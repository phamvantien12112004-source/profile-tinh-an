<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Profile Tiến</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .dashboard-container {
      display: flex;
      height: 100vh;
    }

    /* Sidebar - Danh sách conversations */
    .sidebar {
      width: 320px;
      background: white;
      border-right: 1px solid #eee;
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .sidebar-header h1 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .sidebar-header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .conversations-list {
      flex: 1;
      overflow-y: auto;
    }

    .conversation-item {
      padding: 15px 20px;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.2s;
    }

    .conversation-item:hover {
      background: #fafafa;
    }

    .conversation-item.active {
      background: #f0f0ff;
      border-left: 3px solid #667eea;
    }

    .conversation-item.unread {
      background: #fff8f0;
    }

    .conversation-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .conversation-name {
      font-weight: 600;
      color: #333;
    }

    .conversation-time {
      font-size: 11px;
      color: #999;
    }

    .conversation-preview {
      font-size: 13px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: white;
    }

    .chat-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header-info h2 {
      font-size: 18px;
      color: #333;
    }

    .chat-header-info p {
      font-size: 12px;
      color: #666;
    }

    .header-actions {
      display: flex;
      gap: 10px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-logout {
      background: #f0f0f0;
      color: #333;
    }

    .btn-ai {
      background: #4caf50;
      color: white;
    }

    /* Messages */
    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      margin-bottom: 15px;
      max-width: 70%;
    }

    .message.user {
      margin-left: auto;
    }

    .message.bot, .message.admin {
      margin-right: auto;
    }

    .message-content {
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
    }

    .message.user .message-content {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.bot .message-content {
      background: #f0f0f0;
      color: #333;
      border-bottom-left-radius: 4px;
    }

    .message.admin .message-content {
      background: #fff;
      color: #333;
      border: 2px solid #667eea;
      border-bottom-left-radius: 4px;
    }

    .message-label {
      font-size: 11px;
      color: #667eea;
      margin-bottom: 5px;
      font-weight: 600;
    }

    .message-time {
      font-size: 10px;
      color: #999;
      margin-top: 5px;
    }

    /* Reply form */
    .reply-form {
      padding: 20px;
      border-top: 1px solid #eee;
      background: white;
    }

    .reply-form textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      min-height: 80px;
    }

    .reply-form textarea:focus {
      outline: none;
      border-color: #667eea;
    }

    .reply-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      justify-content: flex-end;
    }

    .btn-send {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-cancel {
      background: #f0f0f0;
      color: #333;
    }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #999;
    }

    .empty-state .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    /* Access denied */
    .access-denied {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px;
    }

    .access-denied h1 {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .access-denied h2 {
      margin-bottom: 10px;
    }

    .access-denied p {
      color: #666;
      margin-bottom: 30px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 15px 25px;
      background: #333;
      color: white;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.success { background: #4caf50; }
    .toast.error { background: #f44336; }

    /* Responsive */
    @media (max-width: 768px) {
      .dashboard-container {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: 40vh;
      }

      .chat-area {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Access Denied -->
  <div id="accessDenied" class="access-denied" style="display: none;">
    <div class="icon">🔒</div>
    <h2>Không có quyền truy cập</h2>
    <p>Bạn cần đăng nhập bằng tài khoản admin.</p>
    <a href="login.html" class="btn btn-send" style="text-decoration: none;">Đăng nhập</a>
  </div>

  <!-- Dashboard -->
  <div id="dashboardContent" class="dashboard-container" style="display: none;">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <h1>📊 Dashboard</h1>
        <p id="adminInfo">Admin</p>
        <button class="btn btn-logout" onclick="handleLogout()" style="margin-top: 10px; width: 100%;">Đăng xuất</button>
      </div>
      <div class="conversations-list" id="conversationsList">
        <div style="padding: 20px; text-align: center; color: #999;">
          Đang tải...
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
      <div class="empty-state" id="emptyState">
        <div class="icon">💬</div>
        <p>Chọn một cuộc trò chuyện để xem</p>
      </div>

      <div id="chatContent" style="display: none;">
        <div class="chat-header">
          <div class="chat-header-info">
            <h2 id="chatUserName">Người dùng</h2>
            <p id="chatUserEmail">email@example.com</p>
          </div>
        </div>

        <div class="messages-container" id="messagesContainer"></div>

        <div class="reply-form">
          <textarea id="replyText" placeholder="Nhập câu trả lời..."></textarea>
          <div class="reply-actions">
            <button class="btn btn-ai" onclick="useAI()">🤖 AI hỗ trợ</button>
            <button class="btn btn-send" onclick="sendReply()">Gửi 💌</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>

  <script>
    let currentUser = null;
    let isAdmin = false;
    let currentConversationId = null;
    let unsubscribeConversations = null;
    let unsubscribeMessages = null;
    let conversations = [];

    // Check auth
    FirebaseService.onAuthStateChange(async (user) => {
      currentUser = user;

      if (!user) {
        document.getElementById('accessDenied').style.display = 'flex';
        document.getElementById('dashboardContent').style.display = 'none';
        return;
      }

      isAdmin = await FirebaseService.checkIsAdmin(user.uid);

      if (!isAdmin) {
        document.getElementById('accessDenied').style.display = 'flex';
        document.getElementById('dashboardContent').style.display = 'none';
        return;
      }

      document.getElementById('accessDenied').style.display = 'none';
      document.getElementById('dashboardContent').style.display = 'flex';
      document.getElementById('adminInfo').textContent = user.email;

      listenConversations();
    });

    // Listen all conversations
    function listenConversations() {
      if (unsubscribeConversations) {
        unsubscribeConversations();
      }

      unsubscribeConversations = FirebaseService.listenAllConversations((snapshot) => {
        conversations = [];
        snapshot.forEach((doc) => {
          conversations.push({ id: doc.id, ...doc.data() });
        });
        renderConversationsList();
      });
    }

    // Render conversations list
    function renderConversationsList() {
      const list = document.getElementById('conversationsList');

      if (conversations.length === 0) {
        list.innerHTML = '<div style="padding: 20px; text-align: center; color: #999;">Chưa có cuộc trò chuyện nào</div>';
        return;
      }

      list.innerHTML = conversations.map(conv => {
        const time = conv.updatedAt ? new Date(conv.updatedAt.toDate()).toLocaleString('vi-VN') : '';
        const hasNewReply = conv.lastMessage && !conv.lastMessage.includes('đã trả lời');
        
        return `
          <div class="conversation-item ${conv.id === currentConversationId ? 'active' : ''}" onclick="selectConversation('${conv.id}')">
            <div class="conversation-header">
              <span class="conversation-name">${escapeHTML(conv.userName || 'Người ẩn danh')}</span>
              <span class="conversation-time">${time}</span>
            </div>
            <div class="conversation-preview">${escapeHTML(conv.lastMessage || 'Chưa có tin nhắn')}</div>
          </div>
        `;
      }).join('');
    }

    // Select conversation
    function selectConversation(convId) {
      if (currentConversationId === convId) return;

      currentConversationId = convId;
      renderConversationsList();

      const conv = conversations.find(c => c.id === convId);
      if (conv) {
        document.getElementById('chatUserName').textContent = conv.userName || 'Người ẩn danh';
        document.getElementById('chatUserEmail').textContent = conv.userEmail || '';
      }

      document.getElementById('emptyState').style.display = 'none';
      document.getElementById('chatContent').style.display = 'flex';
      document.getElementById('chatContent').style.flexDirection = 'column';

      listenMessages(convId);
    }

    // Listen messages in conversation
    function listenMessages(convId) {
      if (unsubscribeMessages) {
        unsubscribeMessages();
      }

      unsubscribeMessages = FirebaseService.listenConversationMessages(convId, (snapshot) => {
        const container = document.getElementById('messagesContainer');
        container.innerHTML = '';

        snapshot.forEach((doc) => {
          const data = doc.data();
          const sender = data.sender || 'bot';
          const text = data.text || '';
          const time = data.createdAt ? new Date(data.createdAt.toDate()).toLocaleString('vi-VN') : '';

          const messageHTML = `
            <div class="message ${sender}">
              ${sender === 'admin' ? '<div class="message-label">💌 Tiến đã trả lời</div>' : ''}
              <div class="message-content">${escapeHTML(text)}</div>
              <div class="message-time">${time}</div>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', messageHTML);
        });

        container.scrollTop = container.scrollHeight;
      });
    }

    // Send reply as admin
    async function sendReply() {
      const text = document.getElementById('replyText').value.trim();
      if (!text) {
        showToast('Vui lòng nhập câu trả lời!', 'error');
        return;
      }

      if (!currentConversationId) {
        showToast('Chưa chọn cuộc trò chuyện!', 'error');
        return;
      }

      const result = await FirebaseService.sendBotOrAdminMessage(currentConversationId, text, 'admin');

      if (result.success) {
        document.getElementById('replyText').value = '';
        showToast('Đã gửi câu trả lời!', 'success');
      } else {
        showToast('Lỗi: ' + result.error, 'error');
      }
    }

    // Use AI to help compose reply
    async function useAI() {
      const text = document.getElementById('replyText').value.trim();
      if (!text) {
        showToast('Nhập tin nhắn cần reply trước!', 'error');
        return;
      }

      showToast('AI đang soạn câu trả lời...', 'success');

      try {
        const response = await fetch(
          'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=YOUR_GEMINI_API_KEY',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: text }] }],
              systemInstruction: {
                parts: [{ text: 'Bạn là Tiến - sinh năm 2004, sống ở Nhật Bản. Soạn câu trả lời ngắn gọn, dễ thương, dùng emoji 💗' }]
              },
              generationConfig: { maxOutputTokens: 200, temperature: 0.8 }
            })
          }
        );

        if (response.ok) {
          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (reply) {
            document.getElementById('replyText').value = reply;
            showToast('AI đã soạn xong!', 'success');
          }
        } else {
          showToast('AI không trả lời được', 'error');
        }
      } catch (error) {
        showToast('Lỗi AI: ' + error.message, 'error');
      }
    }

    // Logout
    async function handleLogout() {
      if (unsubscribeConversations) unsubscribeConversations();
      if (unsubscribeMessages) unsubscribeMessages();
      await FirebaseService.logoutUser();
      window.location.href = 'login.html';
    }

    // Helper
    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // Toast
    function showToast(message, type = '') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // Enter to send
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        if (document.activeElement === document.getElementById('replyText')) {
          e.preventDefault();
          sendReply();
        }
      }
    });
  </script>
</body>
</html>
